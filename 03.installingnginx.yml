- name: Installing the nginx
  hosts: web
  become: yes # its take root user access
  tasks:
  - name: intall nginx
    ansible.builtin.package:
      name: nginx
      state: present
  - name: run  nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes
  - name : installed nginx
    ansible.builtin.debug:
      msg: "Installed nginx succesfully you can play now"
  

