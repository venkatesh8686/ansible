- name: Installing the nginx
  hosts: web
  become: yes
  tasks:
  - name: installing nginx
    ansible.builtin.package:
      name: nginx
      state: present
  - name: run niginx
    ansible.builtin.service:
      name: run nginx
      state: started
      enabled:  yes
  - name: installed and running sucfully
    ansible.builtin.debug:
      msg: "sucfully installed and running nginx"
  

