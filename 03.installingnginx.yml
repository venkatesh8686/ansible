- name: installing nginx and run
  hosts: web
  become: yes
  tasks:
  - name: installing nginx
    ansible.builtin.package:
      name: nginx
      state: present
  - name: run  nginx
    ansible.builtin.service:
      name: nginx
      state: restarted
      enabled: yes
  - name: showing message
    ansible.builtin.debug:
      msg: "Hi there nginx was installed succesfully and running"
  

