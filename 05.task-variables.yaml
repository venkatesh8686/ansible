- name: variable to print
  hosts: web
  vars:
    COURSE: "devops with AWS"
    DURATION: "120hr"
    TRAINER: "siva"
  tasks: 
  - name: print the infromation
    ansible.builtin.debug:
      msg: "Hi this venkatesh started training in {{COURSE}}, duration is :{{DURATION}}, Trainer is:{{TRAINER}}"

  - name: print the information again
    vars: # Task level varables
      CROUSE: "Python"
    ansible.builtin.debug:
      msg: "Hi this venkatesh started training in {{CROUSE}}, duration is {{DURATION}}, Trainer is{{TRAINER}}"
    
  - name: print the info again 
    ansible.builtin.debug:
      msg : "Hi this is venkatesh started training in {{CROUSEE}}, duration is {{DURATION}}, Trainer is {{TRAINER}}"
