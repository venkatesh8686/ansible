- name: Varables promts
  hosts: web
  vars_prompt:
    - name: CROUSE
      prompt: Please Enter the Crouse name
      private: false
    - name: DURATION
      prompt: Please Enter the Crouse duration
      private: false
    - name: TRAINER
      prompt: Please Enter the Trainer name
      private: false
  tasks:
