- name: Installing and running nginx
  hosts: web
  become: true
  vars_files:
    - vars.yaml
  tasks:
  - name: Installing nginx
    ansible.builtin.package:
      name: nginx
      state: present
  - name: running the nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes
  - name: Installed info
    ansible.builtin.debug:
      msg: "Hi there nginx installed succfully and running"

  - name: Gathering info 
    ansible.builtin.debug:
      msg: "hii there ams sstarted {{COURSE}}, duration {{DURATION}}, Trainer name {{TRAINER}} "

